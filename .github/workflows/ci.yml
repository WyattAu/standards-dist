# Dist gate: pins must be current (SC-11), the register must be clean,
# and the vendored routers must run. The canons gate their own content.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * *"
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: WyattAu/standards
          path: standards-can
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Pin freshness (SC-11)
        run: bash build.sh --check
      - name: Register clean (voice-lint over SKILL.md + root docs)
        run: python3 standards-can/scripts/voice-lint.py --strict README.md llms.txt AGENTS.md skills/*/SKILL.md
      - name: Router smoke (pattern + seo + context parse)
        run: |
          python3 skills/pattern-standards/scripts/route.py --node N08 >/dev/null
          python3 skills/pattern-standards/scripts/route.py --list >/dev/null
      - name: Skill budgets
        run: python3 scripts/skill_audit.py skills/pattern-standards skills/context-standards skills/spec-standards skills/engineering-standards skills/present skills/agentspeak
